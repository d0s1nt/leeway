name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write       # create the GitHub release
  id-token: write       # sign the build provenance attestation
  attestations: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag matches VERSION
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - name: Build, self-test and scan
        run: ./release.sh
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/LLM-Usage-*.dmg
            dist/LLM-Usage-*.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(cat VERSION)"
          awk -v v="## $V" 'index($0, v) == 1 {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          cat docs/release-footer.md >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/LLM-Usage-$V.dmg dist/LLM-Usage-$V.zip dist/SHA256SUMS.txt \
            --title "LLM Usage $V" --notes-file notes.md
