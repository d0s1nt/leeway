name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    name: Build and test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon and Intel: the self-test runs natively on each half of the universal binary.
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # check-secrets.sh scans the whole history
      - name: Build universal app, disk image and zip (also runs the self-test and the secret scan)
        run: ./release.sh
      - name: Self-test on this architecture
        run: |
          uname -m
          "dist/LLM Usage.app/Contents/MacOS/LLMUsage" --selftest
      - name: Setup check on a machine with no AI tools
        run: '"dist/LLM Usage.app/Contents/MacOS/LLMUsage" --setup'
      - name: Every command-line flag exits cleanly
        run: |
          BIN="dist/LLM Usage.app/Contents/MacOS/LLMUsage"
          "$BIN" --login status
          "$BIN" --print
          "$BIN" --render-preview "$RUNNER_TEMP/preview.png"
          "$BIN" --render-icon "$RUNNER_TEMP/icon.iconset"
      - name: JSON output and an MCP session
        run: |
          BIN="dist/LLM Usage.app/Contents/MacOS/LLMUsage"
          "$BIN" --json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d["providers"]) == 6, d'
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"get_usage","arguments":{}}}' \
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"best_available","arguments":{}}}' \
            | "$BIN" --mcp > "$RUNNER_TEMP/mcp.out"
          python3 - "$RUNNER_TEMP/mcp.out" <<'EOF'
          import json, sys
          msgs = [json.loads(l) for l in open(sys.argv[1]) if l.strip()]
          assert [m["id"] for m in msgs] == [1, 2, 3, 4], msgs
          assert all("error" not in m for m in msgs), msgs
          assert len(msgs[2]["result"]["structuredContent"]["providers"]) == 6
          print("MCP session OK")
          EOF
